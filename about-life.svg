<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">My approach</title><desc id="desc">Understand the problem, build with suitable tools, and refine for production readiness.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#090909"/><stop offset="1" stop-color="#210B11"/></linearGradient></defs><rect width="1000" height="300" rx="18" fill="url(#bg)" stroke="#48212A"/>
<g font-family="Arial"><text x="36" y="42" font-size="13" letter-spacing="3" fill="#E11D3F">MY APPROACH</text><text x="36" y="78" font-size="28" font-weight="700" fill="#F4F0EB">From real problems to reliable apps.</text>
<rect x="36" y="108" width="286" height="150" rx="14" fill="#171012" stroke="#4A202A"/><circle cx="70" cy="143" r="17" fill="#471320"/><text x="70" y="149" text-anchor="middle" font-size="16" fill="#F4F0EB">01</text><text x="58" y="190" font-size="20" font-weight="700" fill="#F4F0EB">Understand</text><text x="58" y="218" font-size="14" fill="#AAA3A0">Start with the problem.</text><rect x="357" y="108" width="286" height="150" rx="14" fill="#171012" stroke="#4A202A"/><circle cx="391" cy="143" r="17" fill="#471320"/><text x="391" y="149" text-anchor="middle" font-size="16" fill="#F4F0EB">02</text><text x="379" y="190" font-size="20" font-weight="700" fill="#F4F0EB">Build</text><text x="379" y="218" font-size="14" fill="#AAA3A0">Use the right tools and APIs.</text><rect x="678" y="108" width="286" height="150" rx="14" fill="#171012" stroke="#4A202A"/><circle cx="712" cy="143" r="17" fill="#471320"/><text x="712" y="149" text-anchor="middle" font-size="16" fill="#F4F0EB">03</text><text x="700" y="190" font-size="20" font-weight="700" fill="#F4F0EB">Refine</text><text x="700" y="218" font-size="14" fill="#AAA3A0">Aim for production readiness.</text></g></svg>